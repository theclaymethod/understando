[package]
name = "understando-learn"
version = "0.1.0"
edition = "2021"
description = "Local learning app for an understando trust map: chapters, exercises and a sandboxed tutor."
publish = false

[[bin]]
name = "understando-learn"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
libc = "0.2"
bytes = "1"

[profile.release]
opt-level = 3
strip = true
