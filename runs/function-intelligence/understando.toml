# understando per-repo config for Function-Health/function-intelligence. understando never writes this file into the reviewed repo.
schema = "understando.repo/1"
repo = "Function-Health/function-intelligence"
budget_usd = 0
ready_branch = "understando/{pr}-ready"
worktree_root = ".claude/worktrees"
# understando never reads a file that matches one of these globs.
secret_paths = ["projects/clinical-reasoning/harness/**/harness-h1/private*", "**/.env*"]

# understando reports findings here and never edits these files.
[[protected_paths]]
path = "projects/clinical-reasoning/src/cr/note/"
owner = "CN team"
reason = "The CN team owns the note agent code. Report findings to them; do not edit it."

# The only key source: one env file and one variable. Never the keychain, an op reference,
# an inherited variable or a personal login. A command that names a word in require_key_for
# never runs with the key unset, and it is a paid step: it needs a shown cost and a yes.
[llm]
key_source = "env-file"
env_file = "/Users/clayton/dev/function-intelligence/.env"
env_var = "OPENAI_API_KEY"
require_key_for = ["judiciary"]

# The owner of each deferred invariant question, when the trust map does not name one.
[deferred_owners]
"A5-q2" = "loop design (CR harness)"
"L2-q3" = "CN team (note session)"
"L5-q1" = "loop design (CR harness)"
"L6-q1" = "CR clinical-safety owners"
"L6" = "CR clinical-safety owners"
